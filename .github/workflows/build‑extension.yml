name: Build & Release Extension
run-name: Build ${{ github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract plugin id & version from tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            PLUGIN_ID=$(echo "$TAG" | cut -d'-' -f1)
            VERSION=$(echo "$TAG" | cut -d'v' -f2)
          else
            # workflow_dispatch手动触发固定写你的插件ID
            PLUGIN_ID="ENetSchematic"
            VERSION="1.0.0"
          fi
          echo "plugin_id=$PLUGIN_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build extension zip
        run: |
          PLUGIN_ID=${{ steps.meta.outputs.plugin_id }}
          mkdir -p ./zips
          cp -r "./Extensions/$PLUGIN_ID" ./
          zip -r "./zips/$PLUGIN_ID.zip" "$PLUGIN_ID"
          rm -rf "./$PLUGIN_ID"

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ./zips/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update index.json
        if: github.event_name == 'release'
        run: |
          python3 - <<END
          import json, os
          pid = "${{ steps.meta.outputs.plugin_id }}"
          ver = "${{ steps.meta.outputs.version }}"
          with open("index.json","r",encoding="utf-8") as f:
              idx = json.load(f)
          entry = next((x for x in idx if x["id"]==pid), None)
          if entry is None:
              entry = {"id":pid,"versions":[]}
              idx.append(entry)
          ver_item = {"version":ver,"tag":"${{ github.ref_name }}","url":"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"+pid+".zip"}
          entry["versions"].append(ver_item)
          with open("index.json","w",encoding="utf-8") as f:
              json.dump(idx,f,ensure_ascii=False,indent=2)
          END

      - name: Commit index.json update
        if: github.event_name == 'release'
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update index.json for ${{ github.ref_name }}"
          git push origin main
