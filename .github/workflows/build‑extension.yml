name: Build & Release Extension
run-name: Build ${{ github.ref_name }}

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          PLUGIN_ID="ENetSchematic"
          mkdir -p ./zips
          cp -r "./Extensions/$PLUGIN_ID" ./
          zip -r "./zips/$PLUGIN_ID.zip" "$PLUGIN_ID"
          rm -rf "./$PLUGIN_ID"

      - name: Upload artifact for manual download
        uses: actions/upload-artifact@v4
        with:
          name: ENetSchematic-zip
          path: ./zips/*.zip

      - name: Upload to release assets (only on release publish)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ./zips/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
