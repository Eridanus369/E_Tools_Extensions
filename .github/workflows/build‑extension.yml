name: Build & Release Extension
run-name: Build ${{ github.ref_name }}

on:
  release:
    types: [published]
  push:
    tags:
      - '*-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract plugin id & version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PLUGIN_ID="ENetSchematic"
            VERSION="1.0.0"
          else
            TAG=${GITHUB_REF#refs/tags/}
            PLUGIN_ID=$(echo "$TAG" | cut -d'-' -f1)
            VERSION=$(echo "$TAG" | cut -d'v' -f2)
          fi
          echo "plugin_id=$PLUGIN_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build extension zip
        run: |
          PLUGIN_ID=${{ steps.meta.outputs.plugin_id }}
          mkdir -p ./zips
          cp -r "./Extensions/$PLUGIN_ID" ./
          zip -r "./zips/$PLUGIN_ID.zip" "$PLUGIN_ID"
          rm -rf "./$PLUGIN_ID"

      - name: Upload to release assets
        if: github.event_name == 'release' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ./zips/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update index.json
        if: github.event_name == 'release' || github.event_name == 'push'
        run: |
          python3 - <<END
import json
import os
pid = "${{ steps.meta.outputs.plugin_id }}"
ver = "${{ steps.meta.outputs.version }}"
tag = "${{ github.ref_name }}"
repo = "${{ github.repository }}"
url = f"https://github.com/{repo}/releases/download/{tag}/{pid}.zip"
with open("index.json","r",encoding="utf‑8") as f:
            data = json.load(f)
entry = {"id":pid,"version":ver,"download_url":url}
data.append(entry)
with open("index.json","w",encoding="utf‑8") as f:
            json.dump(data,f,indent=2,ensure_ascii=False)
END

      - name: Commit index.json
        if: github.event_name == 'release' || github.event_name == 'push'
        run: |
          git config user.name "github‑actions[bot]"
          git config user.email "github‑actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update index.json for ${{ steps.meta.outputs.plugin_id }} ${{ steps.meta.outputs.version }}"
          git push origin main
